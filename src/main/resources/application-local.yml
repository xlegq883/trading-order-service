# 本地开发环境配置（profile: local）。
# MySQL 由 docker-compose 提供，宿主机端口映射为 3307（本机 3306 已被 MySQL267 占用）。
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/trading?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # -1 表示启动时不做连接探测：数据库不可用也不能阻止应用启动。
      initialization-fail-timeout: -1
      connection-timeout: 3000
      maximum-pool-size: 30
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: localhost:9092
