# 测试环境：使用 H2 内存库，避免依赖本机 MySQL/Redis/Kafka。
spring:
  datasource:
    url: jdbc:h2:mem:trading;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      # 显式 UTF-8，否则 Windows 下按平台编码(GBK)读取 schema.sql 导致中文种子乱码
      encoding: UTF-8
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 测试不启动 Kafka 监听容器
      auto-startup: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fuzuyang.trading.infrastructure.persistence.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fuzuyang.trading: info

app:
  outbox:
    # 测试不启用后台投递，避免依赖 Kafka
    relay-enabled: false
